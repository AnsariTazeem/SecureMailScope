name: Production Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/production-backend
  pull_request:
    branches:
      - feat/production-backend

permissions:
  contents: read

concurrency:
  group: production-backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Production backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install offline packet-analysis prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends tshark
          tshark --version
          capinfos --version

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Run complete backend regression suite
        run: uv run --locked pytest -q

      - name: Audit locked runtime dependencies
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/backend-requirements.txt" --disable-pip --require-hashes --strict

      - name: Check whitespace
        run: git diff --check
